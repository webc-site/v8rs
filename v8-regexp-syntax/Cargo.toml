[package]
name = "v8-regexp-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-regexp-syntax"
keywords = []
categories = []
autobenches = false

[features]
default = []
# 单独评测 regex-syntax 对比项：仅解析对比 oracle，不进产品路径（10.3 红线：RegExp 语义禁用 regex 类执行库）
bench-regex-syntax = ["dep:regex-syntax"]
# 全部对比项评测
bench = ["bench-regex-syntax"]

[[bench]]
name = "main"
path = "benches/main.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
regex-syntax = { version = "0.8.11", optional = true }
thiserror = "2.0.21"
v8-strings = { version = "0.1.0", path = "../v8-strings" }

[dev-dependencies]
aok = "0.1.18"
criterion = "0.8.2"
ctor = "1.0.13"
humansize = "2.1.3"
log = "0.4.34"
log_init = "0.1.39"
rusty_alloc-api = { workspace = true }
