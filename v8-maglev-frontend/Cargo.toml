version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-maglev-frontend"
keywords = []
categories = []

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
gxhash = "3.5.0"
thiserror = "2.0.20"
v8-base = { version = "0.1.0", path = "../v8-base", default-features = false }
