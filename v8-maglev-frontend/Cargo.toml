v8-maglev-ir = { version = "0.1.0", path = "../v8-maglev-ir", default-features = false }
v8-zone = { version = "0.1.0", path = "../v8-zone", default-features = false }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"
