[package]
name = "v8-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-ast"
keywords = []
categories = []
# base.rs 是共享评测模块, 不作为独立 bench 目标
autobenches = false

[features]
default = []
# 单独评测对比实现: Box<dyn> 虚派发手写路径
bench-dyn-box = []
# 全量评测
bench = ["bench-dyn-box"]

[[bench]]
name = "main"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
enum_dispatch = "0.3.13"
gxhash = "3.5.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
v8-common = { version = "0.1.0", path = "../v8-common" }
v8-flags = { version = "0.1.0", path = "../v8-flags" }
v8-numbers = { version = "0.1.0", path = "../v8-numbers" }
v8-strings = { version = "0.1.0", path = "../v8-strings" }
v8-zone = { version = "0.1.0", path = "../v8-zone" }

[dev-dependencies]
aok = "0.1.18"
criterion = "0.8.2"
ctor = "1.0.13"
humansize = "2.1.3"
log = "0.4.34"
log_init = "0.1.39"
rusty_alloc-api = { workspace = true }

