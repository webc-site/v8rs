[package]
name = "v8-objects-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-objects-core"
keywords = []
categories = []

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libc = "0.2.190"
phf = { version = "0.14.0", features = ["macros"] }
thiserror = "2.0.21"
v8-base = { version = "0.1.0", path = "../v8-base" }
v8-common = { version = "0.1.0", path = "../v8-common" }
v8-numbers = { version = "0.1.0", path = "../v8-numbers" }
v8-sandbox = { version = "0.1.0", path = "../v8-sandbox" }
v8-utils = { version = "0.1.0", path = "../v8-utils" }
v8-zone = { version = "0.1.0", path = "../v8-zone" }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"

