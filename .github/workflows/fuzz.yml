name: Fuzz

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # 每日 UTC 20:00 (北京 04:00): 深度 Fuzz 定时检测
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: linux-x86_64
            os: ubuntu-latest
            enable_libfuzzer: true
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-feature=+aes,+sse4.1"
          # Linux aarch64 (ARM)
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            enable_libfuzzer: true
            target: aarch64-unknown-linux-gnu
            rustflags: "-C target-feature=+aes,+neon"
          # macOS (Apple Silicon M-series)
          - platform: macos-arm64
            os: macos-latest
            enable_libfuzzer: true
            target: aarch64-apple-darwin
            rustflags: ""
          # Windows x86_64
          - platform: windows-x86_64
            os: windows-latest
            enable_libfuzzer: false
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-feature=+aes,+sse4.1"

    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.platform }}

      # 全平台通用: 语料库零崩溃全覆盖回归测试
      - name: Run Corpus Regression Tests
        shell: bash
        run: cargo test --manifest-path fuzz/Cargo.toml --test corpus_tests -- --nocapture

      # 支持 libFuzzer 的平台安装 cargo-fuzz
      - name: Install cargo-fuzz
        if: matrix.enable_libfuzzer
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # 运行限时烟雾模糊测试 (30 秒/目标，PR/CI 快速验证突变与插桩稳定性)
      - name: Run Fuzz Smoke Mutation
        if: matrix.enable_libfuzzer
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cd fuzz
          # 显式传递目标平台 target 与专用架构特性 RUSTFLAGS
          cargo fuzz run --target ${{ matrix.target }} fuzz_json -- -max_total_time=30 -max_len=16384
          cargo fuzz run --target ${{ matrix.target }} fuzz_regexp -- -max_total_time=30 -max_len=16384
          cargo fuzz run --target ${{ matrix.target }} fuzz_parser -- -max_total_time=30 -max_len=4096
          cargo fuzz run --target ${{ matrix.target }} fuzz_fuzzilli -- -max_total_time=30 -max_len=1024

