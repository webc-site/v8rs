[package]
name = "v8-numbers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-numbers"
keywords = []
categories = []

autobenches = false

[features]
default = []
# 单独评测对比库 (todo 10.2: ryu / itoa / std 对照)
bench-ryu = []
bench-itoa = []
bench-std = []
# 全量评测
bench = ["bench-ryu", "bench-itoa", "bench-std"]

[[bench]]
name = "main"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
itoa = "1.0.18"
thiserror = "2.0.21"
v8-base = { version = "0.1.0", path = "../v8-base" }
zmij = "1.0.23"

[dev-dependencies]
aok = "0.1.18"
criterion = "0.8.2"
ctor = "1.0.13"
fastrand = "2.5.0"
log = "0.4.34"
log_init = "0.1.39"
ryu = "1.0.23"
rusty_alloc-api = { workspace = true }

