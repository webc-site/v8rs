[package]
name = "v8-interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-interpreter"
keywords = []
categories = []

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fancy-regex = "0.19.2"
gxhash = "3.5.0"
itoa = "1.0.18"
parking_lot = "0.12.5"
thiserror = "2.0.20"
v8-ast = { version = "0.1.0", path = "../v8-ast" }
v8-codegen-core = { version = "0.1.0", path = "../v8-codegen-core" }
v8-common = { version = "0.1.0", path = "../v8-common" }
v8-numbers = { version = "0.1.0", path = "../v8-numbers" }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"

