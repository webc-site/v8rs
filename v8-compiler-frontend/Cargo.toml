[package]
name = "v8-compiler-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-compiler-frontend"
keywords = []
categories = []

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "2.0.20"
v8-base = { version = "0.1.0", path = "../v8-base" }
v8-compiler-broker = { version = "0.1.0", path = "../v8-compiler-broker" }
v8-compiler-graph = { version = "0.1.0", path = "../v8-compiler-graph" }
v8-compiler-ops = { version = "0.1.0", path = "../v8-compiler-ops" }
v8-objects-arrays = { version = "0.1.0", path = "../v8-objects-arrays" }
v8-objects-rest = { version = "0.1.0", path = "../v8-objects-rest" }
v8-zone = { version = "0.1.0", path = "../v8-zone" }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"

