[package]
name = "v8-flags"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "v8-flags"
keywords = []
categories = []
autobenches = false

[features]
default = []
# 单独评测 std HashMap 手写动态查找基线 (对比库: 标准库, 无新增依赖)
bench-hashmap = []
# 全量评测 (包含全部对比库特性)
bench = ["bench-hashmap"]

[[bench]]
name = "main"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
log = "0.4.34"
phf = { version = "0.14.0", features = ["macros"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
aok = "0.1.18"
criterion = "0.8.2"
ctor = "1.0.13"
humansize = "2.1.3"
log = "0.4.34"
log_init = "0.1.39"
rusty_alloc-api = { workspace = true }
sonic-rs = "0.5.10"

